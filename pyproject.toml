[project]
name = "klayout-pex-plugin-palace"
version = "0.1.0"
description = "Palace electrostatic input from KLayout-PEX PEX25D scenes: capacitance matrices by FEM"
authors = [{ name = "Martin Köhler", email = "info@martinjankoehler.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<4.0"
keywords = ["pex", "parasitic", "extraction", "klayout", "palace", "fem", "capacitance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    # plugin API v1 is provisional: stay within one klayout-pex minor release
    "klayout-pex>=0.6.2,<0.7",
    "klayout-pex-plugin-gmsh>=0.1,<0.2",
]

[project.urls]
repository = "https://github.com/iic-jku/klayout-pex-plugin-palace"

[project.entry-points."klayout_pex.exporters.v1"]
palace = "klayout_pex_plugins.palace:create_exporter"

[tool.poetry]
packages = [{ include = "klayout_pex_plugins/palace", from = "src" }]

[tool.poetry.dependencies]
# Until klayout-pex-plugin-gmsh is on PyPI: the checkout next to this one
klayout-pex-plugin-gmsh = { path = "../klayout-pex-plugin-gmsh", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
allure-pytest = ">=2.13.5"
coverage = ">=7.6.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
